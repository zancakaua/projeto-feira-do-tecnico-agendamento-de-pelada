<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#0B0B0C;color:#fff;font:15px/1.45 Manrope,sans-serif}
.photo{height:230px;background:linear-gradient(#0b0b0c00,#0B0B0C),repeating-linear-gradient(90deg,#1d5e2c 0 40px,#226b33 40px 80px);position:relative}

.lbl{color:#8e8e94;font-size:13px}
.av{display:flex;margin:16px 0}
.av i{width:36px;height:36px;border-radius:50%;background:#2a2a2e;border:2px solid #0B0B0C;margin-right:-8px}
.btn{position:absolute;left:16px;right:16px;bottom:28px;background:#E10600;border-radius:14px;text-align:center;padding:16px;font-weight:800;font-size:17px}
</style></head><body>

 </div>
 <div class="bar"><i></i></div>

</div>
